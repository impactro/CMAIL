[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crania-cmail"
version = "26.9.12.post6"
description = "Componente independente de webmail, listas e disparos controlados"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "msal>=1.31,<2",
  "msal-extensions>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
cmail = "cmail.__main__:main"

[project.entry-points."crania_agent.components"]
cmail = "cmail.cm:describe"

[project.entry-points."crania_agent.component_apis"]
cmail = "cmail.api:create_component_api"

[project.entry-points."crania_agent.component_apps"]
cmail = "cmail.web:create_component_app"

[tool.setuptools.packages.find]
include = ["cmail*"]

[tool.setuptools.package-data]
cmail = ["templates/*.html", "static/*.css", "static/*.js", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
