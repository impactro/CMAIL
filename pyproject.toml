[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crania-cmail"
version = "26.11.8.post1"
description = "Componente independente de webmail, listas e disparos controlados"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "msal>=1.31,<2",
  "msal-extensions>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "playwright>=1.55,<2", "tomli>=2,<3; python_version < '3.11'"]

[project.scripts]
cmail = "cmail.__main__:main"

[project.entry-points."crania_agent.components"]
cmail = "cmail.cm:describe"

[project.entry-points."crania_agent.component_apis"]
cmail = "cmail.api:create_component_api"

[project.entry-points."crania_agent.component_apps"]
cmail = "cmail.web:create_component_app"

[tool.setuptools.packages.find]
include = ["cmail*"]

[tool.setuptools.package-data]
cmail = ["static/vendor/cui/**/*", "static/vendor/cui/*.json", "templates/*.html", "static/*.css", "static/*.js", "static/*.mjs", "skills/*/SKILL.md", "defaults/*.json", "defaults/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "simulated: provedor sintético, sem conta real",
  "live: leitura real opt-in em ambiente autorizado",
  "imap: IMAP e SMTP",
  "gmail_api: Gmail API com OAuth web",
  "gmail_file_api: Gmail API com OAuth por arquivo",
  "gmail_file_smtp: Gmail SMTP XOAUTH2 por arquivo",
  "outlook: Microsoft Graph OAuth",
  "shared: contratos compartilhados",
  "browser: interface com navegador",
]

# Portable consumer documentation; no checkout or private instance files.
[tool.setuptools.data-files]
"share/doc/crania-cmail/docs/validation" = ["docs/validation/README.md", "docs/validation/live-plan.example.json", "docs/validation/live-plan.example.md"]
"share/doc/crania-cmail/tests" = ["tests/README.md"]
"share/doc/crania-cmail" = [".env.example", "API.md", "ARCHITECTURE.md", "README.md", "config.example.json", "config.gmail-file.example.json", "config.gmail-smtp.example.json"]
"share/doc/crania-cmail/cmail/defaults" = ["cmail/defaults/cmail.config.md"]
"share/doc/crania-cmail/cmail/skills/consultar-email" = ["cmail/skills/consultar-email/SKILL.md"]
"share/doc/crania-cmail/cmail/skills/consultar-pessoas" = ["cmail/skills/consultar-pessoas/SKILL.md"]
"share/doc/crania-cmail/cmail/skills/enviar-email" = ["cmail/skills/enviar-email/SKILL.md"]
"share/doc/crania-cmail/cmail/skills/gerir-listas-email" = ["cmail/skills/gerir-listas-email/SKILL.md"]
"share/doc/crania-cmail/cmail/skills/google-content" = ["cmail/skills/google-content/SKILL.md"]
"share/doc/crania-cmail/contracts" = ["contracts/capabilities.json", "contracts/list.example.json", "contracts/message.example.json"]
"share/doc/crania-cmail/docs" = ["docs/CUI.md", "docs/microsoft-imap.md", "docs/outgoing-attachments.md", "docs/named-connectors.md", "docs/named-connectors-proposal.md", "docs/configuration-host.md", "docs/configuration-migration.md", "docs/email-templates.md", "docs/gmail-file.md", "docs/google-content.md", "docs/history.md", "docs/host-navigation.md", "docs/inline-images.md", "docs/installed-package.md", "docs/mail-appearance.md", "docs/maintenance.md", "docs/reader-embedding.md", "docs/state-storage.md", "docs/theme-integration-review.md", "docs/theme-integration.md", "docs/webmail-layout.md"]
