<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMAIL</title><link rel="stylesheet" href="/static/style.css"></head>
<body data-csrf="{{ csrf }}"><header><div><small>CrânIA Module</small><h1>CMAIL</h1><p>Webmail, listas e disparos controlados</p></div><button id="refresh">Atualizar caixa</button></header>
<main><aside><h2>Pastas</h2><nav id="folders"></nav><h2>Listas</h2><div id="lists"></div><details><summary>Nova lista</summary><label>Nome<input id="listName"></label><label>Um e-mail por linha<textarea id="listRecipients"></textarea></label><button id="saveList">Salvar lista</button></details></aside><section class="mail"><div id="notice">Carregando…</div><div id="messages"></div></section><section class="compose"><h2>Nova mensagem</h2><label>Lista opcional<select id="listId"><option value="">Nenhuma</option></select></label><label>Destinatários adicionais<input id="to" placeholder="email@dominio.com; outro@dominio.com"></label><label>Assunto<input id="subject"></label><label>Mensagem<textarea id="body"></textarea></label><button id="prepare">Revisar envio</button><div id="preview"></div></section></main><dialog id="confirm"><h2>Confirmar envio</h2><p id="confirmText"></p><button id="execute">Confirmar e enviar</button><button id="cancel">Cancelar</button></dialog><script src="/static/app.js"></script></body></html>
